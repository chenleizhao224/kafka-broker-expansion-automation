apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-controller
  namespace: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-controller
  ports:
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: kafka
spec:
  serviceName: kafka-controller
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka-controller
  template:
    metadata:
      labels:
        app: kafka-controller
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              export KAFKA_NODE_ID="$((100 + ordinal))"
              exec /etc/kafka/docker/run
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_HEAP_OPTS
              value: -Xms128m -Xmx256m
            - name: KAFKA_PROCESS_ROLES
              value: controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 100@kafka-controller-0.kafka-controller.kafka.svc.cluster.local:9093
            - name: KAFKA_LISTENERS
              value: CONTROLLER://:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LOG_DIRS
              value: /tmp/kraft-controller-logs
          ports:
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: controller
            periodSeconds: 5
            failureThreshold: 24
