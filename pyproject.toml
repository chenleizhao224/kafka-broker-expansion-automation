[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kafka-broker-expansion-automation"
version = "0.1.0"
description = "Safely expand a Kubernetes-hosted Kafka cluster from two brokers to three."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "confluent-kafka>=2.5,<3",
  "kubernetes>=30,<33",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
kafka-expand = "kafka_broker_expansion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kafka_broker_expansion"]

[tool.pytest.ini_options]
addopts = "--cov=kafka_broker_expansion --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kafka_broker_expansion"]

